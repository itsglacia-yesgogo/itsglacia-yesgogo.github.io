# Itsglacia.yesgogo — Hugo + Ananke (v2.12.0, vendored in themes/)
# Replace baseURL once the GitHub repo exists:
#   user site  -> https://<username>.github.io/
#   repo site  -> https://<username>.github.io/<repo>/
baseURL = "https://itsglacia-yesgogo.github.io/"
title = "Itsglacia.yesgogo"
theme = "ananke"

defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true

[params]
  custom_css = ["custom.css"]
  email = "yesglacia@gmail.com"
  instagram = "https://www.instagram.com/itsglacia_yesgogo/"

[params.ananke]
  show_recent_posts = false

[taxonomies]
  tag = "tags"

# ----------------------- Languages -----------------------

[languages.en]
  languageName = "EN"
  weight = 1
  title = "Itsglacia.yesgogo"
  [languages.en.params]
    description = "I explore. I create. I connect."
  [[languages.en.menu.main]]
    name = "About"
    pageRef = "/about"
    weight = 1
  [[languages.en.menu.main]]
    name = "Projects"
    pageRef = "/projects"
    weight = 2
  [[languages.en.menu.main]]
    name = "Content"
